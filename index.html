<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Togglut - Toggle + Input Component</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 300px;
    }

    header {
      background: #3d2817;
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 500;
      color: #d4a056;
    }

    .demo-section {
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 24px;
    }

    .demo-section h2 {
      margin: 0 0 20px 0;
      font-size: 1rem;
      font-weight: 400;
      color: #888;
    }

    .examples {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      color: #888;
      font-size: 0.875rem;
    }

    button[type="submit"] {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
    }

    button[type="submit"]:hover {
      background: #388e3c;
    }

    .output {
      background: #0a0a0a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 0.875rem;
      color: #4caf50;
      min-height: 60px;
    }

    .output:empty::before {
      content: 'Form data will appear here...';
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Togglut</h1>
    </header>

    <main class="demo-section">
      <h2>Product Pricing Demo</h2>

      <form id="demo-form">
        <div class="examples">
          <div class="form-group">
            <label id="label-1">Free</label>
            <togglut-input id="toggle-1" name="price1" value="0"></togglut-input>
          </div>

          <div class="form-group">
            <label id="label-2">Price in euros</label>
            <togglut-input id="toggle-2" name="price2" value="120" enabled></togglut-input>
          </div>
        </div>

        <button type="submit">Submit Form</button>
      </form>

      <div class="output" id="output"></div>
    </main>
  </div>

  <script src="togglut.js"></script>
  <script>
    // Form submission handler
    document.getElementById('demo-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    });

    // Dynamic label updates
    const updateLabel = (toggleId, labelId) => {
      document.getElementById(toggleId).addEventListener('change', (e) => {
        document.getElementById(labelId).textContent = e.detail.enabled ? 'Price in euros' : 'Free';
      });
    };

    updateLabel('toggle-1', 'label-1');
    updateLabel('toggle-2', 'label-2');
  </script>
</body>
</html>
